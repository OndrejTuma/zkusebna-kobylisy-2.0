name: Tests

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3.6.0
        with:
          node-version: 18.14.2

      - name: Install packages
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn test:lint

      - name: Run unit tests
        run: yarn test:unit

      - name: Run type test
        run: yarn test:types
